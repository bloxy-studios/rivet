name: Documentation issue
description: Docs are wrong, unclear, or missing
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Which document?
      description: Path or URL.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
      description: If a documented command fails, include the exact command and output — documented commands are required to work.
    validations:
      required: true
